<body>

<header>
  <div class="h-row">
    <div class="h-text">
      <h1 id="hTitle">红军长征路线图</h1><button id="btnTitle" title="修改标题">✎</button>
      <div class="sub" id="hSub">1934.10 — 1936.10 · 中央红军（红一方面军）长征主要节点</div>
    </div>
    <div class="toolbar">
      <button id="btnEdit">编辑</button>
      <button id="btnExport">导出</button>
      <button id="btnImport">导入</button>
      <button id="btnDefault">恢复默认</button>
    </div>
  </div>
</header>
<div id="editBar">编辑模式：点击星星修改内容 · 点击地图空白处添加新事件 · 按住星星可拖动位置</div>

<main class="map-wrap">
  <svg id="map" viewBox="0 0 1000 780" preserveAspectRatio="xMidYMid meet" role="img" aria-label="中国地图与红军长征路线">
    <g id="viewport">
      <g id="gMap"></g>
      <g id="gLabels"></g>
      <g id="gRoute"></g>
      <g id="gStars"></g>
    </g>
  </svg>
  <div class="hint">点击红星查看历史 · 拖动移动 · 双指/滚轮缩放</div>
  <button id="btnQr" title="手机扫码打开">▦</button>
  <div class="zoom-ctl">
    <button id="btnZoomIn" aria-label="放大">＋</button>
    <button id="btnZoomOut" aria-label="缩小">－</button>
    <button id="btnReset" aria-label="复位">⟲</button>
  </div>
</main>

<!-- 事件详情 -->
<div id="sheet" role="dialog" aria-modal="true">
  <img id="sheetImg" alt="" style="display:none">
  <h2 id="sheetTitle"></h2>
  <div id="sheetDate"></div>
  <p id="sheetBody"></p>
  <div class="sheet-btns">
    <button id="btnSheetEdit">✎ 编辑此事件</button>
    <button id="btnSheetClose">关闭</button>
  </div>
</div>

<!-- 编辑表单 -->
<div class="modal" id="editor" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>编辑事件</h3>
    <input type="hidden" id="fId">
    <div class="f-grid">
      <div class="f-item full"><label>事件名称 *</label><input id="fName" maxlength="30" placeholder="如：遵义会议"></div>
      <div class="f-item"><label>时间</label><input id="fDate" maxlength="40" placeholder="如：1935年1月"></div>
      <div class="f-item"><label>路线顺序（数字）</label><input id="fOrder" type="number" inputmode="numeric"></div>
      <div class="f-item"><label>经度</label><input id="fLon" type="number" step="0.01" inputmode="decimal"></div>
      <div class="f-item"><label>纬度</label><input id="fLat" type="number" step="0.01" inputmode="decimal"></div>
      <div class="f-item f-check"><input type="checkbox" id="fMajor"><label for="fMajor">重要节点（大五角星）</label></div>
      <div class="f-item full"><label>图片链接（可留空）</label><input id="fImg" placeholder="assets/xxx.jpg 或任意图片网址"></div>
      <div class="f-item full">
        <label>或从相册上传照片（自动压缩保存）</label>
        <input id="fImgFile" type="file" accept="image/*" style="font-size:0.8rem;">
        <img id="fImgPrev" alt="" style="display:none;max-height:120px;border-radius:8px;border:1px solid var(--rule);margin-top:6px;">
      </div>
      <div class="f-item full"><label>历史介绍</label><textarea id="fDesc" placeholder="这段历史事件的介绍…"></textarea></div>
    </div>
    <div class="m-btns">
      <button id="btnDelete">删除</button>
      <button id="btnEdClose">取消</button>
      <button id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 导入导出 -->
<div class="modal" id="ioModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3 id="ioTitle">导出内容</h3>
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="m-btns">
      <button id="btnIoClose">关闭</button>
      <button id="btnIoOk">复制</button>
    </div>
  </div>
</div>

<!-- 手机扫码 -->
<div class="modal" id="qrModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>手机扫码打开</h3>
    <img src="assets/qr.png" alt="手机访问二维码">
    <p id="qrUrl"></p>
    <div class="m-btns"><button id="btnQrClose">关闭</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="assets/map-data.js"></script>
<script src="assets/app.js"></script>
<script>
  (function () {
    var q = document.getElementById('qrUrl');
    if (location.protocol.indexOf('http') === 0) q.textContent = location.href;
    else q.textContent = '请在电脑上运行本地服务器后，手机与电脑连同一 Wi-Fi 扫码访问';
    document.getElementById('btnQr').onclick = function () { document.getElementById('qrModal').classList.add('open'); };
    document.getElementById('btnQrClose').onclick = function () { document.getElementById('qrModal').classList.remove('open'); };
  })();
</script>
</body>
